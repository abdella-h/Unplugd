services:
    auth_db:
        image: postgres:13
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - auth_db_data:/var/lib/postgresql/data
    auth-service:
        build: ./auth
        ports:
            - "8000:8000"
        depends_on:
            - auth_db
        develop:
            watch:
                - action: sync+restart
                  path: ./auth/app
                  target: /auth/app
                - action: rebuild
                  path: ./auth/requirements.txt
                - action: rebuild
                  path: ./auth/dockerfile

volumes:
    auth_db_data:

    
   
    
