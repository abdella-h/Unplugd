name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-auth:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite://"
    defaults:
      run:
        working-directory: services/auth

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-at-least-32-bytes-long' }}
        run: python -m pytest tests -v

  test-devices:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite://"
    defaults:
      run:
        working-directory: services/devices

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-at-least-32-bytes-long' }}
        run: python -m pytest tests -v

  test-dashboard:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite://"
    defaults:
      run:
        working-directory: services/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-at-least-32-bytes-long' }}
        run: python -m pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
